services:
  rmcluster-frontend:
    image: ghcr.io/rmcluster/frontend:${FRONTEND_BRANCH}
    environment:
      BACKEND_URL: http://host.docker.internal:4917
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rmcluster-backend:
    image: ghcr.io/rmcluster/backend:${BACKEND_BRANCH}
    command: [ "-gcasdb", "/var/lib/rmd/gcas.db", "-storagedb", "/var/lib/rmd/storagedb" ]
    network_mode: host
    volumes:
      - backend-data:/var/lib/rmd
      - model-cache:/root/.cache/huggingface

volumes:
  backend-data:
  model-cache:
